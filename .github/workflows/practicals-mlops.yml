# Practicals: train the movie blockbuster model and test the FastAPI app (Practicals/mlops_demo)
#
#   ci   every push / PR  -> train.py (quality gate: exits 1 if best F1 < 0.80), then pytest the API
#
# Drift monitoring is demonstrated interactively in drift_monitoring.ipynb.
name: practicals-mlops

on:
  push:
    branches: [master]
    paths: ["Practicals/mlops_demo/**", "Data/movie_blockbusters.csv", ".github/workflows/practicals-mlops.yml"]
  pull_request:
    paths: ["Practicals/mlops_demo/**", "Data/movie_blockbusters.csv", ".github/workflows/practicals-mlops.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: Practicals/mlops_demo

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Practicals/mlops_demo/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Train + quality gate
        run: python train.py            # exits 1 if best F1 < MIN_F1 -> pipeline stops here

      - name: Test the API
        run: pytest -q test_api.py
