# Practicals: MLflow + CI/CD + Evidently drift monitoring (Practicals/mlops_demo)
#
#   ci       every push / PR  -> train all models (MLflow), quality gate, register 'production', pytest
#   cd       master only      -> load the 'production' model from the registry and serve a batch
#   monitor  after deploy     -> Evidently compares production data to training data; FAILS on drift
#            + every Monday   -> scheduled drift check (the "monitoring" part of MLOps)
#
# Demo the alarm: Actions tab -> practicals-mlops -> Run workflow -> tick "simulate drift"
name: practicals-mlops

on:
  push:
    branches: [master]
    paths: ["Practicals/mlops_demo/**", "Data/movie_blockbusters.csv", ".github/workflows/practicals-mlops.yml"]
  pull_request:
    paths: ["Practicals/mlops_demo/**", "Data/movie_blockbusters.csv", ".github/workflows/practicals-mlops.yml"]
  schedule:
    - cron: "0 6 * * 1"          # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: "Simulate drifted production data (the monitor job should fail)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: Practicals/mlops_demo

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Practicals/mlops_demo/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Train + track (MLflow) + quality gate + register
        run: python train.py            # exits 1 if best F1 < MIN_F1 -> pipeline stops here

      - name: Test the 'production' model
        run: pytest -q test_model.py

      - name: Save MLflow store + reference data
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store
          path: |
            Practicals/mlops_demo/mlflow.db
            Practicals/mlops_demo/mlruns/
            Practicals/mlops_demo/reference.csv

  cd:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Practicals/mlops_demo/requirements.txt
      - run: pip install -r requirements.txt

      - name: Get the registry from CI
        uses: actions/download-artifact@v4
        with:
          name: mlflow-store
          path: Practicals/mlops_demo

      - name: Deploy - serve this week's batch with models:/movie-blockbuster@production
        run: |
          if [ "${{ inputs.simulate_drift }}" = "true" ]; then
            python simulate_production.py --drift
          else
            python simulate_production.py
          fi
          python predict.py

      - name: Save production batch (input for monitoring)
        uses: actions/upload-artifact@v4
        with:
          name: production-batch
          path: Practicals/mlops_demo/current.csv

  monitor:
    needs: cd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Practicals/mlops_demo/requirements.txt
      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: mlflow-store
          path: Practicals/mlops_demo
      - uses: actions/download-artifact@v4
        with:
          name: production-batch
          path: Practicals/mlops_demo

      - name: Evidently drift check (fails the job if data has drifted)
        run: python monitor_drift.py --fail-on-drift

      - name: Upload the Evidently report
        if: always()                     # keep the report especially when drift was found
        uses: actions/upload-artifact@v4
        with:
          name: evidently-drift-report
          path: Practicals/mlops_demo/drift_report.html
